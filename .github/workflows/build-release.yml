name: Build and Release Agent

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.13"

      - name: Install tools
        run: |
          sudo apt-get install -y osslsigncode jq
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Set version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "value=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Linux agents
        run: |
          for ARCH in amd64 386 arm64 arm; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} go build \
              -ldflags "-s -w" \
              -o "tacticalagent-v${VERSION}-linux-${ARCH}"
          done

      - name: Build macOS agents
        run: |
          for ARCH in amd64 arm64; do
            env CGO_ENABLED=0 GOOS=darwin GOARCH=${ARCH} go build \
              -ldflags "-s -w" \
              -o "tacticalagent-v${VERSION}-darwin-${ARCH}"
          done

      - name: Build Windows agents
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          jq \
            --argjson major "$MAJOR" \
            --argjson minor "$MINOR" \
            --argjson patch "$PATCH" \
            --arg ver "v${VERSION}.0" \
            '
              .FixedFileInfo.FileVersion.Major = $major |
              .FixedFileInfo.FileVersion.Minor = $minor |
              .FixedFileInfo.FileVersion.Patch = $patch |
              .FixedFileInfo.ProductVersion.Major = $major |
              .FixedFileInfo.ProductVersion.Minor = $minor |
              .FixedFileInfo.ProductVersion.Patch = $patch |
              .StringFileInfo.FileVersion = $ver |
              .StringFileInfo.ProductVersion = $ver
            ' versioninfo.json > versioninfo.tmp.json && mv versioninfo.tmp.json versioninfo.json
          ~/go/bin/goversioninfo -o resource_windows.syso versioninfo.json
          for ARCH in amd64 386; do
            env CGO_ENABLED=0 GOOS=windows GOARCH=${ARCH} go build \
              -ldflags "-s -w" \
              -o "tacticalagent-v${VERSION}-windows-${ARCH}.exe"
          done
          rm -f resource_windows.syso

      - name: Sign Windows agents
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "${SIGNING_CERT}" | base64 -d > signing.pfx
          for ARCH in amd64 386; do
            BIN="tacticalagent-v${VERSION}-windows-${ARCH}.exe"
            osslsigncode sign \
              -pkcs12 signing.pfx \
              -pass "${SIGNING_CERT_PASSWORD}" \
              -n "Redysis RMM Agent" \
              -i "https://redysis.com" \
              -ts "http://timestamp.digicert.com" \
              -in "${BIN}" \
              -out "${BIN}.signed"
            mv "${BIN}.signed" "${BIN}"
          done
          rm -f signing.pfx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tacticalagent-v${{ steps.version.outputs.value }}-linux-amd64
            tacticalagent-v${{ steps.version.outputs.value }}-linux-386
            tacticalagent-v${{ steps.version.outputs.value }}-linux-arm64
            tacticalagent-v${{ steps.version.outputs.value }}-linux-arm
            tacticalagent-v${{ steps.version.outputs.value }}-darwin-amd64
            tacticalagent-v${{ steps.version.outputs.value }}-darwin-arm64
            tacticalagent-v${{ steps.version.outputs.value }}-windows-amd64.exe
            tacticalagent-v${{ steps.version.outputs.value }}-windows-386.exe
